<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="t d"><title id="t">Bases em mudanças sucessivas</title><desc id="d">240 vezes 0,85 é 204; 204 vezes 1,10 é 224,40.</desc><rect width="900" height="240" fill="#f4f7f8"/><g font-family="sans-serif" text-anchor="middle" fill="#15384f"><rect x="25" y="85" width="200" height="90" rx="8" fill="white" stroke="#176568"/><rect x="350" y="85" width="200" height="90" rx="8" fill="white" stroke="#176568"/><rect x="675" y="85" width="200" height="90" rx="8" fill="white" stroke="#176568"/><text x="125" y="123" font-size="20">Base inicial</text><text x="125" y="155" font-size="28">240</text><text x="450" y="123" font-size="20">Após o desconto</text><text x="450" y="155" font-size="28">204</text><text x="775" y="123" font-size="20">Após o aumento</text><text x="775" y="155" font-size="28">224,40</text><text x="285" y="60" font-size="21">× 0,85</text><text x="612" y="60" font-size="21">× 1,10</text><text x="450" y="220" font-size="21">Resultado: 93,5% do início; redução total de 6,5%</text></g><g stroke="#176568" stroke-width="3" fill="#176568"><path d="M235 130H335"/><path d="M335 130l-12 -7v14z"/><path d="M560 130H660"/><path d="M660 130l-12 -7v14z"/></g></svg>