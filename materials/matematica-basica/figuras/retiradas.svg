<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Árvore sem reposição</title><desc id="d">Após azul, as chances são 1/4 azul e 3/4 verde. Após verde, 2/4 azul e 2/4 verde.</desc><rect width="900" height="430" fill="#f4f7f8"/><g stroke="#64727b" stroke-width="2"><path d="M170 210L380 110M170 210L380 310M490 110L720 65M490 110L720 165M490 310L720 265M490 310L720 365"/></g><g font-family="sans-serif" fill="#15384f" text-anchor="middle"><text x="120" y="200" font-size="23">5 fichas</text><text x="120" y="230" font-size="20">2 azuis / 3 verdes</text><text x="430" y="100" font-size="25">Azul: 2/5</text><text x="430" y="130" font-size="19">restam 1 A e 3 V</text><text x="430" y="300" font-size="25">Verde: 3/5</text><text x="430" y="330" font-size="19">restam 2 A e 2 V</text><text x="795" y="65" font-size="24">Azul: 1/4</text><text x="795" y="165" font-size="24">Verde: 3/4</text><text x="795" y="265" font-size="24">Azul: 2/4</text><text x="795" y="365" font-size="24">Verde: 2/4</text><text x="450" y="415" font-size="20">Cada segundo passo usa as 4 fichas que restam.</text></g></svg>