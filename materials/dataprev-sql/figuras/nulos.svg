<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
 <title id="title">Lógica do filtro com NULL</title><desc id="desc">WHERE mantém TRUE e descarta FALSE e UNKNOWN. IS NULL testa ausência de valor.</desc>
 <rect width="960" height="310" rx="12" fill="#f5f7f8"/>
 <g font-family="Arial,sans-serif" fill="#233946"><text x="30" y="46" font-size="24" font-weight="bold">O filtro WHERE exige uma condição verdadeira</text><rect x="30" y="85" width="280" height="140" rx="8" fill="#dceeed"/><text x="170" y="134" font-size="25" text-anchor="middle" font-weight="bold">TRUE</text><text x="170" y="184" font-size="21" text-anchor="middle">linha mantida</text><rect x="340" y="85" width="280" height="140" rx="8" fill="#e8ecef"/><text x="480" y="134" font-size="25" text-anchor="middle" font-weight="bold">FALSE</text><text x="480" y="184" font-size="21" text-anchor="middle">linha descartada</text><rect x="650" y="85" width="280" height="140" rx="8" fill="#eee9f2"/><text x="790" y="134" font-size="25" text-anchor="middle" font-weight="bold">UNKNOWN</text><text x="790" y="184" font-size="21" text-anchor="middle">linha descartada</text><text x="30" y="275" font-size="21">nota = NULL → UNKNOWN</text><text x="505" y="275" font-size="21">nota IS NULL → teste de ausência</text></g></svg>