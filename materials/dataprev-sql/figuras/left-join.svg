<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
 <title id="title">Correspondência e preservação no LEFT JOIN</title><desc id="desc">O resultado preserva quatro alunos. Caio tem matrícula com nota nula; Dora não tem matrícula correspondente.</desc>
 <rect width="960" height="450" rx="12" fill="#f5f7f8"/>
 <g font-family="Arial,sans-serif" fill="#233946"><text x="30" y="42" font-size="24" font-weight="bold">LEFT JOIN com status ativa no ON</text><text x="30" y="80" font-size="19">Preserva cada aluno; só combina matrículas ativas.</text><text x="40" y="130" font-size="20" font-weight="bold">Aluno</text><text x="240" y="130" font-size="20" font-weight="bold">Curso</text><text x="400" y="130" font-size="20" font-weight="bold">Nota</text><text x="585" y="130" font-size="20" font-weight="bold">Interpretação</text><text x="40" y="170" font-size="22">Ana</text><text x="240" y="170" font-size="22">10</text><text x="400" y="170" font-size="22">8</text><text x="585" y="170" font-size="22">correspondência</text><text x="40" y="227" font-size="22">Beto</text><text x="240" y="227" font-size="22">10</text><text x="400" y="227" font-size="22">6</text><text x="585" y="227" font-size="22">correspondência</text><text x="40" y="284" font-size="22">Caio</text><text x="240" y="284" font-size="22">20</text><text x="400" y="284" font-size="22">NULL</text><text x="585" y="284" font-size="22">matrícula sem nota</text><rect x="25" y="309" width="910" height="47" fill="#e5eef0" rx="5"/><text x="40" y="341" font-size="22">Dora</text><text x="240" y="341" font-size="22">NULL</text><text x="400" y="341" font-size="22">NULL</text><text x="585" y="341" font-size="22">sem correspondência</text><text x="30" y="415" font-size="19">NULL na nota não prova ausência de matrícula: compare Caio e Dora.</text></g></svg>