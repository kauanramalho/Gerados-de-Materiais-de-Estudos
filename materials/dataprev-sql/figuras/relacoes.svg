<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
 <title id="title">Associação relacional entre alunos e cursos</title><desc id="desc">Aluno e Curso se associam por Matricula. A chave primária de Matricula é composta por duas chaves estrangeiras.</desc>
 <rect width="960" height="400" rx="12" fill="#f5f7f8"/>
 <g font-family="Arial,sans-serif" fill="#233946"><rect x="20" y="54" width="260" height="194" rx="7" fill="white" stroke="#bcc9ce" stroke-width="2"/><path d="M20 108 H280" stroke="#bcc9ce"/><text x="40" y="88" font-size="25" font-weight="bold">Aluno</text><text x="40" y="144" font-size="21">PK   id</text><text x="40" y="186" font-size="21">nome</text><text x="40" y="228" font-size="21">nota_maxima</text><rect x="350" y="54" width="260" height="236" rx="7" fill="white" stroke="#bcc9ce" stroke-width="2"/><path d="M350 108 H610" stroke="#bcc9ce"/><text x="370" y="88" font-size="25" font-weight="bold">Matricula</text><text x="370" y="144" font-size="21">PK/FK  aluno_id</text><text x="370" y="186" font-size="21">PK/FK  curso_id</text><text x="370" y="228" font-size="21">nota</text><text x="370" y="270" font-size="21">status</text><rect x="680" y="54" width="260" height="152" rx="7" fill="white" stroke="#bcc9ce" stroke-width="2"/><path d="M680 108 H940" stroke="#bcc9ce"/><text x="700" y="88" font-size="25" font-weight="bold">Curso</text><text x="700" y="144" font-size="21">PK   id</text><text x="700" y="186" font-size="21">titulo</text><path d="M280 145 H350 M610 187 H645 V145 H680" fill="none" stroke="#21797c" stroke-width="3"/><text x="292" y="132" font-size="18">1</text><text x="315" y="174" font-size="18">N</text><text x="621" y="213" font-size="18">N</text><text x="653" y="132" font-size="18">1</text><text x="32" y="345" font-size="20">A chave composta identifica o par aluno/curso.</text><text x="32" y="376" font-size="18">Cada cadastro pode existir sem matrículas. A FK admite várias referências ao mesmo cadastro.</text></g></svg>