<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 295" width="960" height="295"><title>Três situações de referência</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#416677"/></marker></defs><g font-family="Arial, sans-serif" fill="#15384f"><text x="480" y="40" text-anchor="middle" font-size="28" font-weight="bold">Três situações de referência</text><rect x="20.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="160.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Correspondência</text><text x="160.0" y="149" text-anchor="middle" font-size="22">aluno_id = 1</text><text x="160.0" y="177" text-anchor="middle" font-size="22">Aluno 1 existe</text><text x="160.0" y="205" text-anchor="middle" font-size="22">Referência válida</text><rect x="340.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="480.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Ausência permitida</text><text x="480.0" y="149" text-anchor="middle" font-size="22">aluno_id = NULL</text><text x="480.0" y="177" text-anchor="middle" font-size="22">Coluna anulável</text><text x="480.0" y="205" text-anchor="middle" font-size="22">Relação não obrigatória</text><rect x="660.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="800.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Referência inválida</text><text x="800.0" y="149" text-anchor="middle" font-size="22">aluno_id = 99</text><text x="800.0" y="177" text-anchor="middle" font-size="22">Aluno 99 não existe</text><text x="800.0" y="205" text-anchor="middle" font-size="22">Viola a chave estrangeira</text></g></svg>