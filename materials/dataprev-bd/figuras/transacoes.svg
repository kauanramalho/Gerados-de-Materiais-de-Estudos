<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 295" width="960" height="295"><title>Concorrência: preservar os dois efeitos</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#416677"/></marker></defs><g font-family="Arial, sans-serif" fill="#15384f"><text x="480" y="40" text-anchor="middle" font-size="28" font-weight="bold">Concorrência: preservar os dois efeitos</text><rect x="20.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="160.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">T1 e T2 leem</text><text x="160.0" y="149" text-anchor="middle" font-size="22">Saldo inicial = 100</text><text x="160.0" y="177" text-anchor="middle" font-size="22">T1 pretende somar 20</text><text x="160.0" y="205" text-anchor="middle" font-size="22">T2 pretende somar 30</text><rect x="340.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="480.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Gravação sem controle</text><text x="480.0" y="149" text-anchor="middle" font-size="22">T1 grava 120</text><text x="480.0" y="177" text-anchor="middle" font-size="22">T2 grava 130</text><text x="480.0" y="205" text-anchor="middle" font-size="22">Acréscimo de 20 perdido</text><rect x="660.0" y="75" width="280" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="800.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Efeitos preservados</text><text x="800.0" y="149" text-anchor="middle" font-size="22">Resultado esperado: 150</text><text x="800.0" y="177" text-anchor="middle" font-size="22">Operação e controle</text><text x="800.0" y="205" text-anchor="middle" font-size="22">compatíveis com a regra</text></g></svg>