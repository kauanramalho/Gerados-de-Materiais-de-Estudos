<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"><title>Cada informação depende de sua chave</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#416677"/></marker></defs><g font-family="Arial, sans-serif" fill="#15384f"><text x="480" y="40" text-anchor="middle" font-size="28" font-weight="bold">Cada informação depende de sua chave</text><rect x="50.0" y="75" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="255.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Aluno</text><text x="255.0" y="149" text-anchor="middle" font-size="22">aluno_id → nome</text><text x="255.0" y="177" text-anchor="middle" font-size="22">Cadastro da pessoa</text><rect x="500.0" y="75" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="705.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">Curso</text><text x="705.0" y="149" text-anchor="middle" font-size="22">curso_id → título</text><text x="705.0" y="177" text-anchor="middle" font-size="22">Referência ao instrutor</text><rect x="50.0" y="280" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="255.0" y="317" text-anchor="middle" font-size="25" font-weight="bold">Instrutor</text><text x="255.0" y="354" text-anchor="middle" font-size="22">instrutor_id → nome</text><text x="255.0" y="382" text-anchor="middle" font-size="22">Cadastro do instrutor</text><rect x="500.0" y="280" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="705.0" y="317" text-anchor="middle" font-size="25" font-weight="bold">Matricula</text><text x="705.0" y="354" text-anchor="middle" font-size="22">(aluno, curso) → nota</text><text x="705.0" y="382" text-anchor="middle" font-size="22">Dados do vínculo</text></g></svg>