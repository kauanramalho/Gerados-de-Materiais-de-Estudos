<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 295" width="960" height="295"><title>Localizar a transformação no fluxo</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#416677"/></marker></defs><g font-family="Arial, sans-serif" fill="#15384f"><text x="480" y="40" text-anchor="middle" font-size="28" font-weight="bold">Localizar a transformação no fluxo</text><rect x="50.0" y="75" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="255.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">ETL</text><text x="255.0" y="149" text-anchor="middle" font-size="22">Extrair → Transformar</text><text x="255.0" y="177" text-anchor="middle" font-size="22">→ Carregar no destino</text><rect x="500.0" y="75" width="410" height="172" rx="12" fill="#f1f7f7" stroke="#416677" stroke-width="2"/><text x="705.0" y="112" text-anchor="middle" font-size="25" font-weight="bold">ELT</text><text x="705.0" y="149" text-anchor="middle" font-size="22">Extrair → Carregar</text><text x="705.0" y="177" text-anchor="middle" font-size="22">→ Transformar no destino</text></g></svg>